name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Clone Ghostgram with Submodules
        run: |
          git clone --recursive "https://github.com/ichmagmaus111/ghostgram" .

      - name: Inject Configuration Files
        run: |
          mkdir -p build-system
          cat << 'EOF' > build-system/ghostgram-configuration.json
          {
            "api_id": "38691440",
            "api_hash": "${{ secrets.MY_API_HASH }}",
            "bundle_id": "org.telegram.Telegram",
            "team_id": "1234567890",
            "app_center_id": "",
            "is_internal_build": false,
            "is_appstore_build": false,
            "appstore_id": "0",
            "app_specific_url_scheme": "tg",
            "premium_iap_product_id": "",
            "enable_siri": false,
            "enable_icloud": false
          }
          EOF

      - name: Setup Tools
        run: |
          brew install cmake ninja bazelisk
          pip3 install types-protobuf --break-system-packages

            - name: Build IPA via Pure Bazel
        run: |
          # 1. Отключаем несовместимый с iOS 18.5 скрытый код эффектов скролла авторов форка
          sed -i '' 's/.*EdgeEffect.*/\/\/ Стерто для совместимости с iOS 18.5/g' submodules/UIKitRuntimeUtils/Source/UIKitRuntimeUtils/UIViewController+Navigation.m 2>/dev/null || true
          
          # 2. Вручную создаем структуру папок, которую ищет Bazel
          mkdir -p build-input/configuration-repository
          cp build-system/ghostgram-configuration.json build-input/configuration-repository/ghostgram-configuration.json
          
          # 3. Создаем пустые маркеры репозитория
          touch build-input/configuration-repository/REPO.bazel
          touch build-input/configuration-repository/WORKSPACE
          touch build-input/configuration-repository/BUILD.bazel
          
          # 4. Генерируем папку provisioning и динамически создаем правильные профили для каждого расширения
          mkdir -p build-input/configuration-repository/provisioning
          
          for item in "Telegram:Telegram" "NotificationService:.NotificationService" "NotificationContent:.NotificationContent" "Share:.Share" "Siri:.Siri" "Widget:.Widget" "Intents:.SiriIntents" "Watch:.Watch" "WatchExtension:.WatchExtension" "BroadcastUpload:.BroadcastUpload" "VoIPCipher:.VoIPCipher"; do
            name="${item%%:*}"
            suffix="${item#*:}"
            
            if [ "$name" = "Telegram" ]; then
              full_bundle_id="org.telegram.Telegram"
            else
              full_bundle_id="org.telegram.Telegram${suffix}"
            fi
            
            cat << EOF > build-input/configuration-repository/provisioning/${name}.mobileprovision
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
            <key>AppIDName</key>
            <string>Telegram${name}</string>
            <key>ApplicationIdentifierPrefix</key>
            <array>
              <string>1234567890</string>
            </array>
            <key>CreationDate</key>
            <date>2026-01-01T00:00:00Z</date>
            <key>ExpirationDate</key>
            <date>2036-01-01T00:00:00Z</date>
            <key>Name</key>
            <string>iOS Team Provisioning Profile: ${full_bundle_id}</string>
            <key>Platform</key>
            <array>
              <string>iOS</string>
            </array>
            <key>ProvisionsAllDevices</key>
            <true/>
            <key>Entitlements</key>
            <dict>
              <key>aps-environment</key>
              <string>production</string>
              <key>com.apple.developer.team-identifier</key>
              <string>1234567890</string>
              <key>application-identifier</key>
              <string>1234567890.${full_bundle_id}</string>
              <key>com.apple.security.application-groups</key>
              <array>
                <string>group.org.telegram.Telegram</string>
              </array>
            </dict>
            <key>TeamIdentifier</key>
            <array>
              <string>1234567890</string>
            </array>
            <key>TeamName</key>
            <string>Telegram Team</string>
            <key>TimeToLive</key>
            <integer>3650</integer>
            <key>UUID</key>
            <string>E621E1F8-C36C-495A-93FC-0C247A3E6E5F</string>
            <key>Version</key>
            <integer>1</integer>
          </dict>
          </plist>
          EOF
          done
          
          # 5. Объявляем их экспорт в BUILD файле папки provisioning
          cat << 'EOF' > build-input/configuration-repository/provisioning/BUILD
          exports_files(glob(["*"]))
          EOF
          
          # 6. Записываем переменные конфигурации строго маленькими буквами в кавычках для совместимости с C++
          cat << 'EOF' > build-input/configuration-repository/variables.bzl
          telegram_bazel_path = "/opt/homebrew/bin/bazel"
          telegram_use_xcode_managed_codesigning = "false"
          telegram_bundle_id = "org.telegram.Telegram"
          telegram_aps_environment = "production"
          telegram_api_id = "38691440"
          telegram_api_hash = "${{ secrets.MY_API_HASH }}"
          telegram_team_id = "1234567890"
          telegram_app_center_id = ""
          telegram_is_internal_build = "false"
          telegram_is_appstore_build = "false"
          telegram_appstore_id = "0"
          telegram_app_specific_url_scheme = "tg"
          telegram_premium_iap_product_id = ""
          telegram_enable_siri = "false"
          telegram_enable_icloud = "false"
          EOF
          
          echo 'module(name = "build_configuration")' > build-input/configuration-repository/MODULE.bazel
          
          # 7. Перенаправляем приватный репозиторий в локальную папку внутри WORKSPACE
          sed -i '' 's/build_configuration/build_input\/configuration-repository/g' WORKSPACE 2>/dev/null || sed -i 's/build_configuration/build_input\/configuration-repository/g' WORKSPACE || true
          
          # 8. Запускаем компиляцию с флагом модульного переопределения
          bazel build //Telegram:Telegram --define=disable_codesigning=true --spawn_strategy=local --apple_platform_type=ios --ios_sdk_version=18.5 --ios_minimum_os=18.4 --copt=-Wno-error=unguarded-availability-new --copt=-Wno-error=unguarded-availability --override_module=build_configuration=$PWD/build-input/configuration-repository

      - name: Manual IPA Package
        run: |
          mkdir -p build/Payload
          cp -R bazel-bin/Telegram/Telegram.app build/Payload/ 2>/dev/null || cp -R bazel-bin/Telegram/Telegram_Action.app build/Payload/ 2>/dev/null || true
          cd build && zip -r Telegram.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostgram-ipa
          path: build/Telegram.ipa
